name: Build GP SmartDesk Executables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0, v1.1)'
        required: false
        default: ''

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-github-action@1.1.0

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller \
            --name "GP SmartDesk" \
            --onefile \
            --windowed \
            --add-data "src:index" \
            --add-data "src/css:index/css" \
            --add-data "src/js:index/js" \
            --add-data "src/pages:index/pages" \
            --add-data "src/images:index/images" \
            --add-data "src/js/vendor:index/js/vendor" \
            main.py

      - name: Organize output
        run: |
          mkdir -p dist_bundle

          if [ -f dist/GP\ SmartDesk ]; then
            mv "dist/GP SmartDesk" "dist_bundle/GP-SmartDesk"
          fi

          if [ -f dist/GP\ SmartDesk.exe ]; then
            mv "dist/GP SmartDesk.exe" "dist_bundle/GP-SmartDesk.exe"
          fi

      - name: Create release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use provided version or auto-increment
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            # Simple auto-increment: get last tag, extract number, add 1
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0")
            MAJOR=$(echo $LAST_TAG | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo $LAST_TAG | sed 's/v//' | cut -d. -f2)
            MINOR=$((MINOR + 1))
            TAG="v${MAJOR}.${MINOR}"
          fi

          echo "tag=$TAG" >> $GITHUB_ENV

          # Create annotated tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: "GP SmartDesk ${{ env.tag }}"
          files: dist_bundle/*
          draft: false
          prerelease: false