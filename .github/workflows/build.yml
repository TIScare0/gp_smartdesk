name: GP SmartDesk Production Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gp-smartdesk-production
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build
        run: |
          rm -rf build dist
          pyinstaller --clean --noconfirm gp_smartdesk.spec

      - name: Verify
        run: |
          test -f "dist/GP SmartDesk"

      - name: Rename
        run: |
          mv "dist/GP SmartDesk" "GP-SmartDesk-linux-x64"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GP-SmartDesk-linux-x64
          path: GP-SmartDesk-linux-x64
          if-no-files-found: error
          retention-days: 30


  windows-x64:
    name: Windows x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build
        shell: pwsh
        run: |
          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

          pyinstaller --clean --noconfirm gp_smartdesk.spec

      - name: Verify
        shell: pwsh
        run: |
          if (!(Test-Path "dist/GP SmartDesk.exe")) {
            throw "GP SmartDesk.exe was not created"
          }

      - name: Rename
        shell: pwsh
        run: |
          Move-Item `
            "dist/GP SmartDesk.exe" `
            "GP-SmartDesk-windows-x64.exe"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GP-SmartDesk-windows-x64
          path: GP-SmartDesk-windows-x64.exe
          if-no-files-found: error
          retention-days: 30


  release:
    name: GitHub Release
    needs:
      - linux-x64
      - windows-x64

    runs-on: ubuntu-24.04

    steps:
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: GP-SmartDesk-linux-x64
          path: release

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: GP-SmartDesk-windows-x64
          path: release

      - name: Validate version
        run: |
          VERSION="${{ inputs.version }}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: v1.0.0"
            exit 1
          fi

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags

          VERSION="${{ inputs.version }}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

          git tag -a "$VERSION" -m "GP SmartDesk $VERSION"
          git push origin "$VERSION"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: GP SmartDesk ${{ inputs.version }}
          files: |
            release/GP-SmartDesk-linux-x64
            release/GP-SmartDesk-windows-x64.exe
          generate_release_notes: true
          draft: false
          prerelease: false