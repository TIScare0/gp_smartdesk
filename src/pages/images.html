<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Images — AURA</title>
  <link href="../fonts/jet_brain.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/images.css" />
</head>
<body class="light-theme">

  <div class="ambient-backdrop">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-noise"></div>
  </div>

  <div class="gallery-shell">

    <header class="gallery-topbar">
      <a href="../index.html" class="gallery-back-btn" aria-label="Back to AURA">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>AURA</span>
      </a>
      <span class="gallery-topbar-label">Images</span>
      <button class="gallery-refresh-btn" id="galleryRefreshBtn" title="Refresh" aria-label="Refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </header>

    <main class="gallery-content">
      <section class="gallery-hero">
        <span class="gallery-eyebrow">GENERATED IMAGES</span>
        <h1>Everything you've <span class="serif-italic">created</span>, in one place.</h1>
      </section>

      <!-- STATE: loading -->
      <div class="gallery-loading" id="galleryLoading">
        <div class="gallery-skeleton-grid">
          <div class="gallery-skeleton-card"></div>
          <div class="gallery-skeleton-card"></div>
          <div class="gallery-skeleton-card"></div>
          <div class="gallery-skeleton-card"></div>
        </div>
      </div>

      <!-- STATE: empty -->
      <div class="gallery-empty" id="galleryEmpty" hidden>
        <div class="gallery-empty-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>
        <span class="gallery-empty-title">No images yet</span>
        <span class="gallery-empty-desc">Anything you generate will show up here.</span>
      </div> 

      <!-- STATE: grid -->
      <div class="gallery-grid" id="galleryGrid" hidden></div>
    </main>
  </div>

  <!-- Zoomable lightbox (reuses the shared .lightbox-* styles) -->
  <div class="lightbox-backdrop" id="lightboxBackdrop">
    <div class="lightbox-toolbar">
      <button class="lightbox-btn" id="lightboxZoomOutBtn" title="Zoom out" aria-label="Zoom out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
      <button class="lightbox-btn" id="lightboxZoomInBtn" title="Zoom in" aria-label="Zoom in">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
      <button class="lightbox-btn" id="lightboxResetBtn" title="Reset zoom" aria-label="Reset zoom">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>
      <button class="lightbox-btn lightbox-close-btn" id="lightboxCloseBtn" title="Close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="lightbox-viewport" id="lightboxViewport">
      <img class="lightbox-image" id="lightboxImage" alt="Full size preview" draggable="false" />
    </div>
  </div>

  <div id="toastContainer" class="toast-hub"></div>
  
  <script src="../js/webview.js"></script>
  <script src="../js/script.js"></script>
  <script>
    async function applyTheme() {
      if ((await window.GetItem('aura_theme_mode')) === 'dark') {
        document.body.classList.add('dark-theme');
      }
    }
    applyTheme();
  </script>
  <script src="../js/images.js"></script>
</body>
</html>
