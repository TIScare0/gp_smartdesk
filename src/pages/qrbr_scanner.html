<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR / Barcode Scanner — AURA</title>
    <link href="../fonts/jet_brain.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/scanner.css" />
  </head>
  <body class="light-theme">
    <script>
      if (localStorage.getItem("aura_theme_mode") === "dark") {
        document.body.classList.remove("light-theme");
        document.body.classList.add("dark-theme");
      }
    </script>

    <div class="ambient-backdrop">
      <div class="ambient-orb orb-1"></div>
      <div class="ambient-orb orb-2"></div>
      <div class="ambient-noise"></div>
    </div>

    <div class="scanner-shell">
      <header class="scanner-topbar">
        <a
          href="tools.html"
          class="scanner-back-btn"
          aria-label="Back to Tools"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Tools</span>
        </a>
        <span class="scanner-topbar-label">QR / Barcode Scanner</span>

        <div class="scanner-topbar-right">
          <span class="scan-session-count" id="scanSessionCount"
            >0 scanned this session</span
          >
        </div>
      </header>

      <main class="scanner-content">
        <!-- ===================== VIEWFINDER STAGE ===================== -->
        <section class="viewfinder-stage">
          <div class="viewfinder-frame" id="viewfinderFrame" data-mode="idle">
            <!-- Live camera feed target -->
            <video
              class="viewfinder-video"
              id="viewfinderVideo"
              autoplay
              muted
              playsinline
            ></video>

            <!-- Dropped/uploaded image target -->
            <img
              class="viewfinder-image"
              id="viewfinderImage"
              alt="Uploaded image"
            />

            <!-- Idle placeholder -->
            <div class="viewfinder-idle" id="viewfinderIdle">
              <svg
                width="40"
                height="40"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <line x1="14" y1="14" x2="14" y2="21"></line>
                <line x1="21" y1="14" x2="21" y2="21"></line>
                <line x1="17.5" y1="14" x2="17.5" y2="17.5"></line>
                <line x1="14" y1="17.5" x2="21" y2="17.5"></line>
              </svg>
              <span>Start your camera or drop an image to begin scanning</span>
            </div>

            <!-- Live status pill, bottom of frame -->
            <div class="viewfinder-status-pill" id="viewfinderStatusPill">
              <span class="status-pulse-dot"></span>
              <span id="viewfinderStatusText">Camera off</span>
            </div>
          </div>

          <!-- Controls beneath the frame -->
          <div class="scanner-controls">
            <button class="scanner-primary-btn" id="startCameraBtn">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M23 7l-7 5 7 5V7z"></path>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
              Start camera
            </button>

            <label class="scanner-secondary-btn" for="scannerFileInput">
              <input
                type="file"
                id="scannerFileInput"
                accept="image/*"
                hidden
              />
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              Upload image
            </label>

            <button
              class="scanner-secondary-btn"
              id="stopCameraBtn"
              style="display: none"
            >
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              </svg>
              Stop
            </button>
          </div>
        </section>

        <!-- ===================== RESULTS LIST ===================== -->
        <section class="scan-results-section">
          <div class="scan-results-heading">
            <h2>Scanned codes</h2>
            <button class="scanner-clear-btn" id="clearResultsBtn">
              Clear all
            </button>
          </div>

          <div class="scan-results-list" id="scanResultsList">
            <div class="scan-results-empty" id="scanResultsEmpty">
              <span>Nothing scanned yet — detected codes will appear here</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="toastContainer" class="toast-hub"></div>

    <script src="../js/vendor/zxing.min.js"></script>
    <script src="../js/scanner.js"></script>
  </body>
</html>
